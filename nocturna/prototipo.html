<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rueda Nocturna · Rueda Libre</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="bg-slate-950 text-slate-100 font-sans">
        <main>
            <section class="min-h-screen px-6 py-16 md:px-12 flex flex-col justify-center items-center text-center">
                <p class="mb-6 px-4 py-1 rounded-full bg-amber-400/10 text-amber-300 text-xs md:text-sm font-semibold uppercase tracking-widest">
                    Nuevo · Jueves a sábado
                </p>

                <h1 class="mb-4 text-5xl md:text-7xl font-extrabold tracking-tight text-white">
                    Rueda Nocturna
                </h1>

                <p class="mb-10 max-w-xl text-lg md:text-xl text-slate-300 leading-relaxed">
                    Descubre Medellín en bici cuando se encienden las luces
                </p>

                <ul class="mb-10 flex flex-col sm:flex-row gap-4">
                    <li class="px-8 py-4 rounded-2xl bg-slate-800 border border-slate-700">
                        <span class="block text-3xl font-bold text-amber-300">3</span>
                        <span class="text-sm text-slate-400 uppercase tracking-wide">rutas</span>
                    </li>
                    <li class="px-8 py-4 rounded-2xl bg-slate-800 border border-slate-700">
                        <span class="block text-sm text-slate-400 uppercase tracking-wide">desde</span>
                        <span class="text-3xl font-bold text-amber-300">$55.000</span>
                    </li>
                </ul>

                <a href="#inscripcion" class="inline-block px-8 py-4 rounded-full bg-amber-400 text-slate-950 text-lg font-bold shadow-lg shadow-amber-400/30 hover:bg-amber-300 focus:outline-none focus:ring-4 focus:ring-amber-400/50 transition">
                    Inscríbete
                </a>
            </section>
        </main>
    </body>
</html>
